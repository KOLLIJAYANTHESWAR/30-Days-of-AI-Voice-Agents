<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber AI Voice Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cyber grid background -->
  <div class="grid-background"></div>

  <!-- Floating orbs -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>

  <div class="container">
    <div class="voice-agent">
      <h3>Voice Agent</h3>

      <div class="chat-log" id="chatLog">
        <div class="message received">
          <span>Press "Start Recording" to begin.</span>
        </div>
        <div id="transcription-box" class="message final-transcription"></div>
      </div>

      <div class="controls">
        <button id="startAndstopBtn">Start Recording</button>
        <div class="loading" id="loading">
          <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
